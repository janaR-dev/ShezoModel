# Free HTTPS hosting on Render (https://render.com/docs/blueprint-spec).
#
# Render's free instance sleeps after 15 idle minutes and has an ephemeral
# filesystem, so the SQLite demo database is re-seeded from `shezo.seed` on
# every boot: test data resets, it is not a place for real records.
#
# The public URL is HTTPS, which is required for camera/microphone capture:
# browsers only expose getUserMedia in a secure context.
services:
  - type: web
    name: shezo
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m shezo.seed && python -m shezo.api
    healthCheckPath: /api/health
    envVars:
      - key: SHEZO_HOST
        value: 0.0.0.0
      - key: SHEZO_DB_ENGINE
        value: sqlite
      - key: SHEZO_DB
        value: shezo.db
      # Optional LLM narration. Add the value in the Render dashboard only.
      - key: SHEZO_LLM_API_KEY
        sync: false
